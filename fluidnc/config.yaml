board: MKS TinyBee V1.0 XXYYZ
name: MKS TinyBee V1.0 XXYYZ
stepping:
  engine: I2S_STATIC
  idle_ms: 255
  pulse_us: 10
  dir_delay_us: 2
  disable_delay_us: 2
spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18
sdcard:
  cs_pin: gpio.5
  card_detect_pin: gpio.34
  frequency_hz: 8000000
kinematics: {}
axes:
  x:
    steps_per_mm: 50
    max_rate_mm_per_min: 8000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 304
    soft_limits: false
    motor0:
      limit_neg_pin: gpio.33:low
      hard_limits: true
      pulloff_mm: 2
      stepstick:
        step_pin: i2so.1
        direction_pin: i2so.2:low
        disable_pin: i2so.0
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.0
      seek_mm_per_min: 1000
  z:
    steps_per_mm: 10
    max_rate_mm_per_min: 120
    acceleration_mm_per_sec2: 100
    max_travel_mm: 1.1
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 0.1
      rc_servo:
        output_pin: gpio.2
        pwm_hz: 50
        min_pulse_us: 1800
        max_pulse_us: 600
    homing:
      cycle: 1
      mpos_mm: 1
      positive_direction: true
    soft_limits: false
  y:
    steps_per_mm: 50
    max_rate_mm_per_min: 8000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 304
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: gpio.22:low
      limit_pos_pin: gpio.32:low
      hard_limits: true
      pulloff_mm: 2
      stepstick:
        step_pin: i2so.4
        direction_pin: i2so.5
        disable_pin: i2so.3
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
    motor1:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 2
      stepstick:
        step_pin: i2so.10
        direction_pin: i2so.11
        disable_pin: i2so.9
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.0
      seek_mm_per_min: 1000
    soft_limits: false
  homing_runs: 2
coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0
macros: {}
start:
  must_home: true
  deactivate_parking: true
  check_limits: true
user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN
user_inputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN
arc_tolerance_mm: 0.002
junction_deviation_mm: 0.01
verbose_errors: true
report_inches: false
enable_parking_override_control: false
use_line_numbers: true
planner_blocks: 16
i2so:
  bck_pin: gpio.25
  data_pin: gpio.27
  ws_pin: gpio.26
